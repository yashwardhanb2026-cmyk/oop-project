name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release NutriScore APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Sync Web & ML Assets to Android APK Bundle
        run: |
          mkdir -p android/app/src/main/assets/www/models
          cp web/index.html web/style.css web/app.js web/manifest.json android/app/src/main/assets/www/
          cp web/models/* android/app/src/main/assets/www/models/
          echo "Web and ML models successfully bundled into Android assets."

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p dist
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" dist/NutriScore-v1.0.0.apk
            echo "Copied $APK_FILE to dist/NutriScore-v1.0.0.apk"
            ls -lh dist/
          else
            echo "Error: No APK file found in android/app/build/outputs/apk/"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriScore-APK
          path: dist/NutriScore-v1.0.0.apk

      - name: Generate Release Tag
        id: tag
        run: |
          TAG="v1.0.0-build.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "NutriScore Mobile App ${{ steps.tag.outputs.tag }}"
          body: |
            # 🍏 NutriScore ML • Android Mobile App (${{ steps.tag.outputs.tag }})

            Download the APK directly to your phone: **NutriScore-v1.0.0.apk** (attached below)

            ---

            ### 🚀 Features in this Release:
            * **Offline On-Device ML**: Evaluates food grades across the entire **A to E** spectrum using embedded XGBoost decision trees and TF-IDF Natural Language Processing.
            * **Official 2024 European Nutri-Score (FSAm-NPS)**: Full scientific calculation with exact nutrient penalty and positive protein/fiber scoring.
            * **Live Camera Barcode Scanner**: Hardware-accelerated barcode & food label scanner with tactile audio/vibration feedback.
            * **Interactive Nutrient Tuner (What-If Simulator)**: Dynamic sliders for Energy, Sugar, Saturated Fat, Salt, Fiber, and Protein.
            * **Ingredients NLP Evaluator**: Automatically tags whole clean foods vs. ultra-processed markers.
            * **100% Offline Capable**: Zero internet required after installing.
          files: |
            dist/NutriScore-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
